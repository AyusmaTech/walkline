[versions]
kotlin = "2.3.0"
agp = "8.13.2"
compose-bom = "2025.08.00"
activity = "1.10.1"
lifecycle = "2.9.2"
maps = "19.2.0"
location = "21.3.0"
okhttp = "4.12.0"

[libraries]
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
play-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "maps" }
play-location = { module = "com.google.android.gms:play-services-location", version.ref = "location" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
json-test = { module = "org.json:json", version = "20240303" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }
fragment = { module = "androidx.fragment:fragment", version = "1.8.9" }
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version = "13.7.1" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
